/networks:
  net_ab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24

  net_bc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24

services:
  node_a:
    build: .
    container_name: aether_node_a
    stdin_open: true
    tty: true
    command: ["--name", "node_a", "--psk", "ghostmesh-secret"]
    networks:
      net_ab:
        ipv4_address: 172.30.1.10

  node_b:
    build: .
    container_name: aether_node_b
    stdin_open: true
    tty: true
    command: ["--name", "node_b", "--psk", "ghostmesh-secret"]
    networks:
      net_ab:
        ipv4_address: 172.30.1.11
      net_bc:
        ipv4_address: 172.30.2.10

  node_c:
    build: .
    container_name: aether_node_c
    stdin_open: true
    tty: true
    command: ["--name", "node_c", "--psk", "ghostmesh-secret"]
    networks:
      net_bc:
        ipv4_address: 172.30.2.11
